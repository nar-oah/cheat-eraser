[package]
name = "viewer"
version = "0.1.0"
authors = ["naroah <givefacegod@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "viewer"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
anyhow = "1.0"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embedded-graphics = "0.8.2"
embedded-svc = { version = "0.29", default-features = false }
epd-waveshare = { git = "https://github.com/caemor/epd-waveshare.git", features = ["graphics"] }
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tinybmp = "0.7"
u8g2-fonts = { version = "0.7", features = ["embedded_graphics_textstyle"] }

[build-dependencies]
embuild = "0.33"
