[package]
name = "cheat-eraser"
version = "0.1.0"
authors = ["god-s_face"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "cheat-eraser"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["std", "binstart", "experimental"] }
anyhow = "1.0"
esp-idf-sys = { version = "0.36", features = ["binstart"] }

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "2.1" }
bindings_header = "src/bindings.h"
bindings_module = "camera"
